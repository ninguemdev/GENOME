[project]
name = "genome"
version = "0.0.0"
description = "Laboratório de vida artificial e neuroevolução exposto como ParallelEnv do PettingZoo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dionel Morais" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "numba>=0.60",
    "pettingzoo>=1.24",
    "gymnasium>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genome"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "TID", "RUF", "D"]

# Docstrings and comments quote the specification's symbols.
allowed-confusables = ["α", "γ", "δ", "ε", "η", "θ", "κ", "μ", "ρ", "σ", "τ", "φ", "χ", "ω", "×", "−"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use genome.core.rng (ARQUITETURA §2.5)."
"numpy.random.seed".msg = "Use genome.core.rng (ARQUITETURA §2.5)."
"numpy.random.default_rng".msg = "Only genome.core.rng creates generators (ARQUITETURA §2.5)."
"numpy.random.SeedSequence".msg = "Only genome.core.rng creates seed sequences (ARQUITETURA §2.5)."
# Built-in hash() cannot be banned by ruff; tests/test_forbidden_apis.py checks it.

[tool.ruff.lint.per-file-ignores]
"src/genome/core/rng.py" = ["TID251"]
"tests/**" = ["D", "TID251"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

# Numba, SciPy and PettingZoo ship no type information; they are typed at the call sites.
[[tool.mypy.overrides]]
module = ["numba", "numba.*", "scipy", "scipy.*", "pettingzoo", "pettingzoo.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=genome.core",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = ["slow: testes acima de ~2 s (rodam só na suíte completa)"]

[tool.coverage.run]
branch = true
source = ["genome"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "genome"

[[tool.importlinter.contracts]]
name = "core é independente"
type = "forbidden"
source_modules = ["genome.core"]
forbidden_modules = ["genome.neat", "genome.envs", "genome.lab", "genome.io", "genome.viz"]

[[tool.importlinter.contracts]]
name = "neat só depende do core"
type = "forbidden"
source_modules = ["genome.neat"]
forbidden_modules = ["genome.envs", "genome.lab", "genome.io", "genome.viz"]

[[tool.importlinter.contracts]]
name = "envs só depende do core"
type = "forbidden"
source_modules = ["genome.envs"]
forbidden_modules = ["genome.neat", "genome.lab", "genome.io", "genome.viz"]

[[tool.importlinter.contracts]]
name = "io depende só do core e do neat"
type = "forbidden"
source_modules = ["genome.io"]
forbidden_modules = ["genome.envs", "genome.lab", "genome.viz"]

[[tool.importlinter.contracts]]
name = "viz depende só do core e do io"
type = "forbidden"
source_modules = ["genome.viz"]
forbidden_modules = ["genome.neat", "genome.envs", "genome.lab"]
