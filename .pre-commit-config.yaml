# Hooks locais: usam as versões fixadas no uv.lock (PADROES §9).
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types_or: [python, pyi, toml]
      - id: pytest-fast
        name: pytest (rápido)
        entry: uv run pytest -q -m "not slow"
        language: system
        pass_filenames: false
        types_or: [python, pyi, toml, yaml]
